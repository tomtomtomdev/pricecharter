[project]
name = "pricecharter"
version = "0.1.0"
description = "Crawl PriceCharting console lists and game detail pages into SQLite"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "beautifulsoup4>=4.12",
]

[project.scripts]
pricecharter = "pricecharter.cli:main"

[dependency-groups]
analysis = [
    "jinja2>=3.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "threadpoolctl>=3.5",
]
ui = [
    "fastapi>=0.115",
    "httpx2>=2.13.1",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "analysis", "ui"]
